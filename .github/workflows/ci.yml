name: ci

on:
  pull_request:
    # labeled/unlabeled re-run the contract gate when the review label changes (§5.7).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.17"
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  CYCLONEDX_BOM_VERSION: "7.4.0"

# Python components live in their own folders; these jobs check contract_testing/ (§5–9) and
# the shared kernel it builds on. The uv workspace and lock are at the repository root.
defaults:
  run:
    working-directory: contract_testing

# Every third-party action is pinned by commit SHA; the tag is in the trailing comment.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run mypy

  architecture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run lint-imports

  test:
    runs-on: ubuntu-24.04
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run pytest --cov

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      # Real Postgres via testcontainers; the runner's Docker daemon is available by default.
      - run: uv run pytest -m integration

  policy-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run adapter-verify policy lint

  golden-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      # Golden runs stay out of CI until a network-isolated runner exists (D-089).
      - run: uv run adapter-verify golden lint

  contract-check:
    runs-on: ubuntu-24.04
    permissions:
      checks: read  # when the PR head was pushed (a label must be newer)
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      # REVIEW_REQUIRED passes only when a CODEOWNER applied the review label (§5.7) after the
      # head was pushed; owners come from the base commit's CODEOWNERS, not the PR's.
      # A failed lookup leaves approved unset, so the check runs without the override.
      - name: Review label applied by a code owner
        id: review
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          uv run python scripts/review_label.py --pr "$PR_NUMBER" --repo "$REPO"
          --head-sha "$HEAD_SHA" --label contract-review-approved --codeowners-ref "$BASE_SHA"
      # Report goes to the job summary and to a retained artifact that records the approver.
      - name: Contract check
        env:
          REVIEW_APPROVED: ${{ steps.review.outcome == 'success' && steps.review.outputs.approved == 'true' }}
          APPROVER: ${{ steps.review.outputs.approver }}
        run: |
          args=(--report contract-report.md)
          if [ "$REVIEW_APPROVED" = "true" ] && [ -n "$APPROVER" ]; then
            args+=(--review-approved)
          fi
          status=0
          uv run adapter-verify contract check "${args[@]}" || status=$?
          if [[ " ${args[*]} " == *" --review-approved "* ]] \
            && grep -qsF 'Review required, passed by' contract-report.md; then
            printf '\nReview label applied by code owner @%s.\n' "$APPROVER" \
              | tee -a contract-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: contract-report
          path: contract_testing/contract-report.md
          retention-days: 90

  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv lock --check

  spec-fresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv run python scripts/gen_spec.py --check

  secrets:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .  # the whole repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No env files tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::env files must never be committed:"
            echo "$tracked"
            exit 1
          fi
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  deps-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: uv export --locked --all-groups --no-emit-workspace --format requirements-txt -o audit-requirements.txt
      - run: uv run pip-audit --strict --require-hashes --disable-pip -r audit-requirements.txt

  sbom:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, types, architecture, test, integration, policy-lint, contract-check, lockfile, spec-fresh, secrets, deps-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv export --locked --no-dev --no-emit-workspace --format requirements-txt -o runtime-requirements.txt
      - run: >-
          uvx --from "cyclonedx-bom==${CYCLONEDX_BOM_VERSION}" cyclonedx-py requirements
          runtime-requirements.txt --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: contract_testing/sbom.cdx.json
