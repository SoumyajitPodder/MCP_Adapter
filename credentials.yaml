# Which secret each tool's connector may use (brief §9.7). Names only; values live in the
# secret manager. TODO(owner): align names with the organization's secret manager.
bindings:
  - tool: order.get
    versions: ">=1.0.0,<2.0.0"
    secret_name: order-management/read
  - tool: service.get
    versions: ">=1.0.0,<2.0.0"
    secret_name: service-inventory/read
  - tool: inventory.snapshot
    versions: ">=1.0.0,<2.0.0"
    secret_name: inventory-feed/read
