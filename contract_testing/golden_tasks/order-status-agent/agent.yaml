# How the golden runner starts this agent: the in-repo reference agent on the NVIDIA API
# catalog (D-095; Gemini, D-083, is `provider: gemini`).
# Stand-in until the agent's owning team provides the real one. TODO(owner): replace.
agent_id: order-status-agent
harness: reference
provider: nvidia
model: openai/gpt-oss-20b
system_prompt: >-
  You are the order status agent for a telecom provider's customer support team.
  Answer customer questions about orders and services by looking them up with the tools
  you have. Base every statement on tool results; if a tool fails, say you could not check.
  Never promise delivery or completion dates, and never offer to change, cancel, reinstate
  or reactivate anything: you can only look things up. Reply to the customer in two or
  three plain sentences.
limits:
  max_tool_calls: 10
  timeout_s: 120
